<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Murador Equipamientos</title><link rel="stylesheet" href="/styles.css"><style>body{padding:24px}.admin{max-width:1000px;margin:auto}.panel{background:white;padding:22px;margin:18px 0;border:1px solid #ddd}input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc}textarea{min-height:55vh;font:13px monospace}.btn{margin:6px 6px 6px 0}.hidden{display:none}</style></head><body><div class="admin"><a href="/">← Volver al catálogo</a><h1>ADMINISTRACIÓN MURADOR</h1><section id="login" class="panel"><h2>Acceso administrador</h2><input id="user" placeholder="Usuario" autocomplete="username"><input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="loginBtn" class="btn dark">INGRESAR</button><p id="msg"></p></section><section id="editor" class="panel hidden"><h2>Catálogo de productos (JSON)</h2><p>Podés editar códigos, nombres, marcas, líneas, categorías, descripciones, fotos y visibilidad. Conservá el formato JSON.</p><textarea id="data"></textarea><button id="save" class="btn dark">GUARDAR CATÁLOGO</button><button id="logout" class="btn yellow">CERRAR SESIÓN</button><p id="status"></p></section></div><script>
const $=s=>document.querySelector(s);async function api(path,opts={}){return fetch("/api/"+path,{credentials:"same-origin",headers:{"content-type":"application/json",...(opts.headers||{})},...opts})}
async function check(){let r=await api("session");let d=await r.json();if(d.authenticated)openEditor()}function openEditor(){$("#login").classList.add("hidden");$("#editor").classList.remove("hidden");load()}async function load(){let r=await api("admin");let d=await r.json();$("#data").value=JSON.stringify(d.products,null,2)}$("#loginBtn").onclick=async()=>{let r=await api("login",{method:"POST",body:JSON.stringify({username:$("#user").value,password:$("#pass").value})});let d=await r.json();if(!r.ok){$("#msg").textContent=d.error||"No se pudo ingresar";return}openEditor()};$("#save").onclick=async()=>{try{let products=JSON.parse($("#data").value);let r=await api("products",{method:"PUT",body:JSON.stringify({products})});let d=await r.json();$("#status").textContent=r.ok?"Guardado: "+d.count+" productos":(d.error||"Error al guardar")}catch(e){$("#status").textContent="JSON inválido: "+e.message}};$("#logout").onclick=async()=>{await api("logout",{method:"POST"});location.reload()};check();</script></body></html>
